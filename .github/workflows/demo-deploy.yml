name: Demo Deploy
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Java demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>aliyun</id>
                <name>Aliyun Maven</name>
                <url>https://maven.aliyun.com/repository/public</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
          </settings>
          EOF
      - name: Install parent POM
        run: mvn -q install -N -DskipTests
      - name: Install dependencies
        run: mvn -q install -DskipTests -pl jeeflow-core,jeeflow-repository-jdbc,jeeflow-spring-boot-autoconfigure,jeeflow-spring-boot4-starter
      - name: Build demo jar
        run: mvn -q -pl jeeflow-demo-boot4 package -DskipTests -Dspring-boot.repackage.skip=true
      - name: Build Docker image
        run: docker build -f Dockerfile.demo -t jeeflow-java-demo:latest .
      - name: Export image
        run: |
          docker save jeeflow-java-demo:latest -o jeeflow-java-demo.tar
          chmod 644 jeeflow-java-demo.tar
      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: jeeflow-java-demo.tar
          target: /java_projects/jeeflow/demo/
      - name: Load image and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /java_projects/jeeflow/demo
            docker load -i jeeflow-java-demo.tar
            # Stop and remove old container if exists
            docker stop jeeflow-java-demo 2>/dev/null && docker rm jeeflow-java-demo 2>/dev/null || true
            docker run -d --name jeeflow-java-demo --restart always -p 16080:8080 jeeflow-java-demo:latest
            rm -f jeeflow-java-demo.tar
            echo "✅ Java demo deployed (port 16080->8080)"
