name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>aliyun</id>
                <name>Aliyun Maven</name>
                <url>https://maven.aliyun.com/repository/public</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.SONATYPE_USERNAME }}</username>
                <password>${{ secrets.SONATYPE_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: Publish to Maven Central
        run: |
          # 重试 3 次（Sonatype 偶尔暂时性失败）
          for i in 1 2 3; do
            echo "=== 尝试发布 ($i/3) ==="
            if mvn -P release deploy -DskipTests \
              "-Dgpg.passphrase=${{ secrets.GPG_PASSPHRASE }}" \
              -pl '!:jeeflow-demo-boot4' \
              -B; then
              echo "✅ 发布成功"
              exit 0
            fi
            echo "⚠️ 第 $i 次尝试失败，等待 30 秒后重试..."
            sleep 30
          done
          echo "❌ 3 次尝试均失败"
          exit 1
      # 发布成功 ≠ 用户拉得到：Sonatype → repo1.maven.org 传播有 ~15min 延迟，
      # 没这一步时 CI 绿只代表 `mvn deploy` 退 0（历史上出过假绿）。轮询各模块 .pom 到 200 才算发出去。
      - name: Verify artifacts visible on repo1.maven.org
        run: bash scripts/verify-maven-central.sh "$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"

