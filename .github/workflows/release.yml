name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>aliyun</id>
                <name>Aliyun Maven</name>
                <url>https://maven.aliyun.com/repository/public</url>
                <mirrorOf>central</mirrorOf>
              </mirror>
            </mirrors>
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.SONATYPE_USERNAME }}</username>
                <password>${{ secrets.SONATYPE_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: Publish to Maven Central
        run: |
          # 重试 3 次（Sonatype 偶尔暂时性失败）
          for i in 1 2 3; do
            echo "=== 尝试发布 ($i/3) ==="
            if mvn -P release deploy -DskipTests \
              "-Dgpg.passphrase=${{ secrets.GPG_PASSPHRASE }}" \
              -pl '!:jeeflow-demo-boot4' \
              -B; then
              echo "✅ 发布成功"
              exit 0
            fi
            echo "⚠️ 第 $i 次尝试失败，等待 30 秒后重试..."
            sleep 30
          done
          echo "❌ 3 次尝试均失败"
          exit 1

  verify:
    name: Verify Maven Central
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Maven Central indexing
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "⏳ 等待 Maven Central 索引同步..."
          sleep 60
          for i in {1..20}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://repo1.maven.org/maven2/com/mldong/jeeflow/jeeflow-core/${VERSION}/jeeflow-core-${VERSION}.pom")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Maven Central jeeflow-core:${VERSION} 已可用"
              exit 0
            fi
            echo "   等待中... ($i/20) HTTP: $HTTP_CODE"
            sleep 30
          done
          echo "❌ Maven Central 验证超时"
          exit 1
