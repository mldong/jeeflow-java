name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  test:
    name: Test (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: [8, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - name: Run tests
        run: mvn clean install -DskipTests=false -B

  publish:
    name: Publish to Maven Central
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.SONATYPE_USERNAME }}</username>
                <password>${{ secrets.SONATYPE_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: Publish to Maven Central
        run: |
          mvn -P release deploy -DskipTests \
            "-Dgpg.passphrase=${{ secrets.GPG_PASSPHRASE }}" \
            -B
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts
          path: |
            */target/*.jar
            */target/*.pom
          retention-days: 7

  verify:
    name: Verify Maven Central
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Maven Central indexing
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "⏳ 等待 Maven Central 索引同步..."
          sleep 60
          for i in {1..20}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://repo1.maven.org/maven2/com/mldong/jeeflow/jeeflow-core/${VERSION}/jeeflow-core-${VERSION}.pom")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Maven Central jeeflow-core:${VERSION} 已可用"
              exit 0
            fi
            echo "   等待中... ($i/20) HTTP: $HTTP_CODE"
            sleep 30
          done
          echo "❌ Maven Central 验证超时"
          exit 1
