spring:
  datasource:
    url: jdbc:h2:mem:jeeflow_demo;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      encoding: utf-8
      schema-locations: classpath:schema.sql
      # 数据不再用 data.sql 双份维护：流程定义由 FlowSeedRunner 启动时直读共享 flows 目录

jeeflow:
  worker-id: 1
