<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流程设计器 · 钉钉模式</title>
<script type="importmap">
{
  "imports": {
    "vue": "https://unpkg.com/vue@3.4.30/dist/vue.esm-browser.js"
  }
}
</script>
<link rel="stylesheet" href="/designer/style.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.6 system-ui,sans-serif;background:#f0f2f5;overflow:hidden;height:100vh}
.app-bar{height:48px;background:#1677ff;color:#fff;display:flex;align-items:center;padding:0 16px;gap:16px;z-index:100;position:relative;flex-shrink:0}
.app-bar h3{font-size:15px;font-weight:600}
.app-bar a{color:rgba(255,255,255,.85);text-decoration:none;font-size:13px;padding:2px 8px;border-radius:4px}
.app-bar a:hover{background:rgba(255,255,255,.15)}
.app-bar .actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{padding:4px 14px;border:none;border-radius:4px;cursor:pointer;font-size:13px}
.btn-white{background:#fff;color:#1677ff}
.btn-outline{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
#app{height:100vh;display:flex;flex-direction:column}
#designer-wrap{flex:1;min-height:0;position:relative}
#jsonPanel{display:none;position:fixed;bottom:0;left:0;right:0;height:220px;overflow:auto;background:#1e1e1e;color:#d4d4d4;padding:12px;z-index:200;font-size:12px;white-space:pre-wrap;font-family:monospace}
</style>
</head>
<body>
<div id="app">
  <div class="app-bar">
    <h3>🧊 jeeflow · 流程设计器</h3>
    <a href="/">← 返回仪表盘</a>
    <span style="font-size:12px;opacity:.8">钉钉模式</span>
    <div class="actions">
      <span style="font-size:12px;opacity:.8" id="nodeCount">节点: -</span>
      <button class="btn btn-outline" onclick="toggleJSON()">JSON</button>
      <button class="btn btn-white" onclick="saveFlow()">保存</button>
    </div>
  </div>
  <div id="designer-wrap"></div>
</div>
<div id="jsonPanel"></div>

<script type="module">
import { createApp, ref, nextTick } from 'vue'
import FlowDesigner from '/designer/mldong-flow-designer-plus.js'

const defaultGraph = {
  name: "wf-leave",
  displayName: "请假流程",
  instanceUrl: "leaveForm",
  nodes: [
    { id:"start", type:"snaker:start", x:120, y:200, properties:{}, text:{value:"开始"} },
    { id:"task1", type:"snaker:task", x:320, y:200, properties:{form:"leave-form", assignee:"leader", taskType:0, performType:0}, text:{value:"组长审批"} },
    { id:"task2", type:"snaker:task", x:520, y:200, properties:{form:"leave-form", assignee:"manager", taskType:0, performType:0}, text:{value:"经理审批"} },
    { id:"end", type:"snaker:end", x:720, y:200, properties:{}, text:{value:"结束"} }
  ],
  edges: [
    { id:"e1", sourceNodeId:"start", targetNodeId:"task1", properties:{} },
    { id:"e2", sourceNodeId:"task1", targetNodeId:"task2", properties:{} },
    { id:"e3", sourceNodeId:"task2", targetNodeId:"end", properties:{} }
  ]
}

const processForm = {
  labelWidth: '130px',
  formItems: [
    { name:'name', label:'流程编码', component:'Input', componentProps:{placeholder:'请输入流程定义唯一编码'} },
    { name:'displayName', label:'流程名称', component:'Input', componentProps:{placeholder:'请输入流程显示名称'} },
    { name:'type', label:'流程类型', component:'Select', defaultValue:'snaker',
      componentProps:{ placeholder:'请选择流程类型', options:[
        {label:'主流程',value:'snaker'}, {label:'子流程',value:'sub'}
      ]}
    }
  ]
}

const app = createApp({
  data() {
    return {
      graphData: JSON.parse(JSON.stringify(defaultGraph)),
      mode: 'dingtalk',
      processForm
    }
  },
  methods: {
    onInit(api) {
      console.log('FlowDesigner init', api)
      window._fdApi = api
      // 统计节点数
      nextTick(() => this.updateNodeCount())
    },
    onSave(data) {
      console.log('FlowDesigner save', data)
      this.updateNodeCount()
    },
    updateNodeCount() {
      const nodes = this.graphData?.nodes?.length || 0
      document.getElementById('nodeCount').textContent = '节点: ' + nodes
    }
  },
  template: `
    <FlowDesigner
      v-model:value="graphData"
      :mode="mode"
      :process-form="processForm"
      @on-init="onInit"
      @on-save="onSave"
    />
  `
})

app.component('FlowDesigner', FlowDesigner)
const vm = app.mount('#designer-wrap')

// 全局方法
window.toggleJSON = () => {
  const panel = document.getElementById('jsonPanel')
  if (panel.style.display === 'block') { panel.style.display = 'none'; return }
  panel.textContent = JSON.stringify(vm.graphData, null, 2)
  panel.style.display = 'block'
}
window.saveFlow = () => {
  console.log('SAVE:', JSON.stringify(vm.graphData, null, 2))
  alert('已输出到浏览器控制台 (F12 → Console)')
  window.toggleJSON()
}
window._vm = vm
</script>
</body>
</html>
